  (function(){var gi=0;GENSTYLES.forEach(function(st){st.pal.forEach(function(h){var k="g"+gi;gi++;var v=st.f(h);GENMAP[k]=v;THEMES.push({k:k,n:st.sn+" · "+hueName(h),bg:v["--d-bg"],fg:v["--d-accent"]});});});})();
  /* GEN-THEMES-END */
  // which generated keys are light (by style)
  var LIGHT_NAMED={apple:1,sunrise:1,glass:1,parchment:1,cream:1};
  var LIGHT_GEN={};
  (function(){var gi=0;GENSTYLES.forEach(function(st){st.pal.forEach(function(){if(st.light)LIGHT_GEN["g"+gi]=1;gi++;});});})();
  document.getElementById('sub').textContent=THEMES.length+' רקעים — '+NAMED_COUNT+' מעוצבים לבחירה + '+(THEMES.length-NAMED_COUNT)+' אוטומטיים · כך ייראה המסך בכל אחד';

  var grid=document.getElementById('grid');
  function isLight(t){return !!(GENMAP[t.k]?LIGHT_GEN[t.k]:LIGHT_NAMED[t.k]);}
  function miniHTML(){return '<div class="mini"><div class="m-top"><div><div class="m-dow">יום רביעי</div><div class="m-hd">י״ז בחשוון תשפ״ז</div></div><div class="m-bsd">בס״ד</div></div><div class="m-clock">21:45</div><div class="m-bar"></div><div class="m-ev">כיבוי אורות · בעוד 15 דק׳</div><div class="m-msg">ברוכים הבאים לקומה</div></div>';}
  function render(filter){
    grid.innerHTML='';
    THEMES.forEach(function(t,idx){
      var gen=!!GENMAP[t.k];
      if(filter==='named'&&gen)return;
      if(filter==='dark'&&isLight(t))return;
      if(filter==='light'&&!isLight(t))return;
      var item=document.createElement('div');item.className='item';
      var card=document.createElement('div');card.className='card';
      if(gen){var v=GENMAP[t.k];for(var key in v)card.style.setProperty(key,v[key]);}
      else card.setAttribute('data-theme-name',t.k);
      card.innerHTML=miniHTML();
      var lab=document.createElement('div');lab.className='label';lab.textContent=t.n;
      item.appendChild(card);item.appendChild(lab);grid.appendChild(item);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.toolbar button'),function(b){
    b.addEventListener('click',function(){
      Array.prototype.forEach.call(document.querySelectorAll('.toolbar button'),function(x){x.classList.remove('on');});
      b.classList.add('on');render(b.getAttribute('data-f'));
    });
  });
  render('all');
</script>
